<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — NEXOR</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">NEXOR</a>

      <nav class="main-nav" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="index.html#catalogo">Catálogo</a>
        <a href="login.html" aria-current="page">Iniciar sesión</a>
        <a href="registro.html">Crear cuenta</a>
      </nav>
    </div>
  </header>

  <main class="auth-layout">

    <aside class="auth-panel">
    </aside>

    <section class="auth-form-section">
      <h1>Inicia sesión</h1>
      <p>Ingresa con tu correo y contraseña para continuar.</p>

      <form id="form-login" novalidate>

        <div class="form-field">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" autocomplete="email" required>
          <span class="field-error" id="error-correo" aria-live="polite"></span>
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <span class="field-error" id="error-password" aria-live="polite"></span>
        </div>

        <div class="form-field form-field--checkbox">
          <input type="checkbox" id="recordarme" name="recordarme">
          <label for="recordarme">Recordarme en este equipo</label>
        </div>

        <button type="submit">Iniciar sesión</button>

      </form>

      <p class="auth-switch">¿Aún no tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
    </section>

  </main>

  <footer class="site-footer">

  </footer>

  <script src="js/validaciones.js" defer></script>
</body>
</html>
